<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GImage</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="chat-wrap">
    <!-- 图标导航栏 -->
    <nav class="icon-rail">
      <div class="rail-logo">G</div>
      <div class="rail-nav">
        <div class="rail-item active" title="生成"><span class="ico">✦</span>生成</div>
        <a class="rail-item" href="/gallery.html" title="资产库"><span class="ico">🖼️</span>资产</a>
        <a class="rail-item" id="adminLink" href="/admin.html" title="管理" style="display:none"><span class="ico">⚙️</span>管理</a>
      </div>
      <div class="rail-foot">
        <div class="rail-avatar" id="whoAvatar" title=""></div>
        <button class="icon-btn" id="logoutBtn" title="退出">⏻</button>
      </div>
    </nav>

    <!-- 侧边栏:会话历史 -->
    <aside class="sidebar" id="sidebar">
      <div class="s-head">
        <span class="brand">GImage</span>
        <button class="icon-btn" id="closeSidebar" title="收起">✕</button>
      </div>
      <div style="padding:8px">
        <button style="width:100%" id="newChatBtn">+ 新对话</button>
      </div>
      <div class="s-list" id="sessionList"></div>
      <div class="s-foot">
        <span class="muted" id="who" style="font-size:12px"></span>
      </div>
    </aside>

    <!-- 主区域 -->
    <div class="main">
      <button class="icon-btn sidebar-toggle" id="openSidebar" title="展开侧栏">☰</button>

      <!-- 聊天消息区 -->
      <div class="chat-body" id="chatBody"></div>

      <!-- 悬浮输入卡片:模式/模型/参数/积分/发送 全部收进一张卡片 -->
      <div class="input-bar">
        <div class="input-inner">
          <div class="ic-top">
            <input type="file" id="refFile" accept="image/*" multiple hidden />
            <button class="ref-tile" id="attachBtn" type="button" title="添加参考图">
              <span class="plus">+</span><span class="lbl">参考内容</span>
            </button>
            <textarea id="prompt" rows="1" placeholder="描述你想要的画面…" autofocus></textarea>
          </div>
          <div class="ref-preview" id="refPreview"></div>
          <div class="extra-fields" id="extraFields"></div>
          <div class="ic-bottom">
            <div class="mode-selector" id="modeSelector">
              <button class="mode-btn" id="modeBtn" type="button"></button>
              <div class="mode-dropdown" id="modeDropdown"></div>
            </div>
            <div class="model-selector" id="modelSelector">
              <button class="ghost sm" id="modelBtn" type="button">选择模型</button>
              <div class="model-dropdown" id="modelDropdown"></div>
            </div>
            <input type="hidden" id="model" />
            <span id="modelHint" class="model-hint"></span>
            <div class="input-opts" id="paramsBar"></div>
            <div class="ic-tail">
              <span class="credit-badge">✦ <b id="remaining">-</b>/<span id="quota">-</span></span>
              <button class="send-btn" id="genBtn" title="生成 (Ctrl+Enter)">➤</button>
            </div>
          </div>
        </div>
        <div class="error" id="err"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
