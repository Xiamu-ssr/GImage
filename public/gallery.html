<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GImage · 资产库</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">GImage · 资产库</div>
    <div class="right">
      <a href="/app.html">工作台</a>
      <a id="adminLink" href="/admin.html" style="display:none">管理</a>
      <button class="ghost" id="logoutBtn">退出</button>
    </div>
  </div>

  <div class="gallery-toolbar">
    <div class="g-tabs" id="modalityTabs">
      <button class="active" data-tab="all">全部</button>
      <button data-tab="image">图片</button>
      <button data-tab="video">视频</button>
      <button data-tab="music">音乐</button>
    </div>
    <input type="search" id="searchInput" placeholder="搜索提示词…" />
    <select id="sortSel">
      <option value="newest">最新优先</option>
      <option value="oldest">最旧优先</option>
    </select>
    <div class="spacer"></div>
    <button class="ghost sm" id="batchToggle">批量管理</button>
  </div>

  <div class="gallery" id="gallery"><span class="muted" style="padding:20px">加载中…</span></div>

  <div class="batch-bar" id="batchBar">
    <span class="muted">已选 <b id="batchCount">0</b> 项</span>
    <button class="ghost sm" id="batchSelectAll">全选</button>
    <div class="spacer"></div>
    <button class="ghost sm" id="batchDownload">下载已选</button>
    <button class="danger sm" id="batchDelete">删除已选</button>
    <button class="ghost sm" id="batchCancel">取消</button>
  </div>

  <script type="module" src="/gallery.js"></script>
</body>
</html>
